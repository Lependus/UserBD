server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.mail.host=127.0.0.1
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.from=noreply@example.com
spring.mail.port=1025
spring.mail.default-encoding=UTF-8

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=org.example.notification.event.UserEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false