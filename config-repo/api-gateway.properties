server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users,/users/**

spring.cloud.gateway.server.webflux.routes[1].id=notification-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notifications,/notifications/**

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=userCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/users
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes=500,502,503,504

spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=notificationCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes=500,502,503,504

resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.event-consumer-buffer-size=100

resilience4j.circuitbreaker.instances.userCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.base-config=default

resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.instances.notificationCircuitBreaker.timeout-duration=10s

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents